name: Build & deploy to Firebase Hosting

on:
  push:
    branches: [main, claude/funny-dijkstra-8xyszz]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      # Deploys only once the Firebase service-account key is added as a repository secret.
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Firebase key missing
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Add the FIREBASE_SERVICE_ACCOUNT secret to deploy (see README)."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/download-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: dist
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_KEY == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: nhl123-c439b
          channelId: ${{ github.event_name == 'pull_request' && '' || 'live' }}
